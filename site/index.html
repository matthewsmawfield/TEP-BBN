    <meta name="dc.description" content="The spectroscopic identification of primordial deuterium---a foundational empirical pillar of Big Bang cosmology---is not mathematically unique. Within standard Voigt-profile fitting architectures, the absorption features conventionally attributed to deuterium across the three best-studied quasar sightlines are statistically better described by unrestricted ordinary hydrogen. Using Monte-Carlo-calibrated model comparison across Q1009+2956 (Keck/HIRES), PKS\,1937$-$101 (ESPRESSO), and J1332$+$0052 (UVES+HIRES), the unrestricted hydrogen model is significantly preferred over the true-deuterium model under both the canonical-parent and adversarial parent-reassignment statistics ($p \le 0.001$ for all three sightlines on the primary Gate 2/3 family, surviving $\alpha/6$). The key physical insight is that isotope identifiability is controlled by both Doppler regime and D column density: at the unsaturated LLS-class columns typical of D/H measurements, the intrinsic H/D profile-shape difference is sub-noise on a per-pixel basis, so the deuterium identification depends predominantly on the velocity offset---which the free-H model can reproduce without invoking deuterium at all. A multi-pronged evidence analysis (Gate 8) calibrates three discriminators---$b$-value ratio, velocity offset deviation, and column density difference---against true-D injection Monte Carlo ($N = 1000$ per sightline): the joint statistic is highly significant for Q1009+2956 and PKS\,1937$-$101 ($p ≤ 0.001$), with velocity deviations alone rejecting isotope-D at $p ≤ 0.001$ for both sightlines; J1332$+$0052 is less discriminating. All three features are blueward of the parent, consistent with the conformal sign theorem (though the D-selected sample is not an independent sign test). A velocity-selection theorem explains the universality of the $-81.6$\,km/s offset as a selection effect of the D-search protocol, and motivates an independently selected population test for non-isotope displaced H I components. An archival feasibility search establishes the principal saturation and Ly$\alpha$-forest selection limits and identifies one candidate component in Q1009$+$2956, motivating a larger targeted survey. A pilot search of the three benchmark sightlines identifies one candidate feature already present in the literature scaffold near the predicted orphan phenotype in Q1009$+$2956: a narrow ($b = 10.3$\,km/s, $\log N = 11.5$) H I component at $\Delta v = -155.5$\,km/s from the parent ($73.9$\,km/s from the isotope shift), identified as a candidate non-isotope component in the HIRES spectrum. Conformal core–edge geometry predicts a blueward sign. An absorber-regime amplitude ansatz $S_A^{\rm abs}$ is introduced for diffuse absorbers; Cassini independently constrains the source-charge response $S_\Sigma^{(\odot)}$, while the relation between these projections remains to be derived from the common microscopic scalar solution. The conformal-only amplitude is $\sim10^{-2}\,\mathrm{km\,s^{-1}}$; the temporal-disformal channel activated by the cosmological scalar time derivative was investigated as a candidate amplitude mechanism. It can reach the observed scale per sightline in the Einstein-frame parametrisation explored here. The power-law $B(\phi)$ forms tested so far do not achieve predictive closure across the three sightlines: $n = 2$ is excluded by the Cassini bound without environmental screening of $B$, while $n = 5$ loses Lorentzian signature above $z \approx 3.4$. The full covariant calculation (Gate 10) with $\omega=-u^\mu k_\mu$ confirms that the near-criticality and cross-redshift signature loss persist under the complete matter-frame treatment when the drift is imported from the $\Lambda$CDM expansion history; the binding constraint is then the $A^2/\dot{\bar\phi}^{\,2}$ variation across redshift, which prevents any single increasing power-law $B(\phi)$ from achieving simultaneous near-criticality at all three sightlines. That constraint is shown to be a property of the imported rate rather than of the disformal channel: the joint sign-and-closure criterion reduces to $d\ln H_T^2/d\ln(1+z) &lt; 0$ — a descent-type ambient drift — and the unsourced free-roll on the reconstructed corpus potential, $\dot{\bar\phi}^{\,2} = \bar\Pi_\infty^2 + \bar\rho\,e^{-\bar\varphi}$, satisfies it. Under the pure-descent limit the descent-tracking coupling $B(\varphi) = B_0\,\varphi^4/(\varphi_c^4+\varphi^4)\,e^{-\varphi}$ has inverse-fit roots agreeing to a factor $1.0001$ and satisfies the Cassini and GW170817 bounds; forward evaluation at that common $B_0$ does not reproduce the three amplitudes, and the branch is independently excluded by ambient-lapse self-consistency: the boundary factor $u = B\dot{\bar\phi}^{\,2}/A^2$ is constant along the descent at $\approx 1 - 10^{-4}$, so the matter-metric redshift map $1+z = \tilde N(0)/\tilde N(\bar\varphi)$ would require a negative ambient field to reproduce the observed absorber population. The unscreened temporal-disformal amplitude channel is thereby bounded sub-critical at these epochs; a contribution of the observed scale can arise only where $B(\phi)$ is environmentally screened. The $-81.6$\,km/s clustering is explained by the velocity-selection theorem (Gate 6-I) as a selection effect of the D-search protocol, not as a universal TEP-produced shift. Within the adopted VMO-dominated reaction-flow model, the helium-4 abundance is reproduced as an equilibrium, while a conditional opacity theorem provides an observable high-redshift boundary without a physical plasma wall. Cosmological redshift is reformulated as temporal transport over a static spatial background. The broader TEP framework—CMB acoustic peak preservation, temporal-horizon regularity, cosmological distances without expansion, and JWST high-redshift phenomenology—is developed in companion papers.">
